{{define "meeting.html"}}
{{template "head" .}}

<header class="header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
            <a href="/" style="text-decoration:none;color:var(--text-tertiary);font-size:0.85rem">&larr; Back</a>
            <h1 class="header__title">{{.Meeting.Title}}</h1>
            {{if .Meeting.Description}}
            <p class="header__subtitle">{{.Meeting.Description}}</p>
            {{end}}
        </div>
        {{template "theme_toggle"}}
    </div>
    <div class="card__meta" style="margin-top:12px">
        <span>{{.Meeting.DurationMin}} min</span>
    </div>
</header>

<div class="booking-controls">
    <div class="form-row">
        <div class="form-group">
            <label for="date-picker">Date</label>
            <input type="date" id="date-picker" name="date" value="{{.Today}}" min="{{.Today}}"
                   hx-get="/{{.Meeting.Slug}}/slots"
                   hx-target="#slots-container"
                   hx-include="[name='tz']"
                   hx-trigger="change"
                   hx-indicator="#slots-loading">
        </div>
        <div class="form-group">
            <label for="guest-tz">Timezone</label>
            <select name="tz" id="guest-tz"
                    hx-get="/{{.Meeting.Slug}}/slots"
                    hx-target="#slots-container"
                    hx-include="[name='date']"
                    hx-trigger="change">
            </select>
        </div>
    </div>
    <span class="htmx-indicator" id="slots-loading"><span class="spinner"></span></span>
</div>

<p id="booking-notice" role="alert" hidden style="color:var(--text-tertiary);margin-top:16px"></p>
<div id="slots-container" aria-live="polite">
    <p style="color:var(--text-tertiary)">Select a date to see available times.</p>
</div>

<div id="booking-form" style="display:none;margin-top:32px">
    <h3 style="margin-bottom:16px;font-weight:600">Your details</h3>
    <form id="booking-request" hx-post="/{{.Meeting.Slug}}/book" hx-include="[name='tz']">
        <input type="hidden" name="start" id="selected-start">
        <div class="form-group">
            <label for="subject">Meeting subject</label>
            <input type="text" id="subject" name="subject" placeholder="What would you like to discuss?">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Confirm Booking</button>
    </form>
</div>

<script>
(function() {
    var form = document.getElementById('booking-request');
    var notice = document.getElementById('booking-notice');
    var slots = document.getElementById('slots-container');
    var bookingPanel = document.getElementById('booking-form');
    var submit = form.querySelector('button[type="submit"]');
    var bookingLocked = false;
    function message(text) {
        notice.textContent = text;
        notice.hidden = false;
    }
    function clearSelection() {
        document.getElementById('selected-start').value = '';
        bookingPanel.style.display = 'none';
    }
    function isBooking(detail) { return detail.elt === form; }
    function isAvailability(detail) { return detail.target === slots; }
    function bookingFailure(xhr) {
        var knownNotCreated = xhr && xhr.getResponseHeader('HX-Booking-State') === 'not-created';
        if (knownNotCreated) {
            bookingLocked = false;
            form.dataset.bookingState = 'not-created';
            submit.disabled = false;
            submit.textContent = 'Confirm Booking';
            clearSelection();
            slots.textContent = '';
            message('Your booking was not created. Availability could not be confirmed. Select a date to check again, or contact the host.');
        } else {
            bookingLocked = true;
            form.dataset.bookingState = 'unknown';
            submit.disabled = true;
            submit.textContent = 'Awaiting verification';
            message('We could not confirm the booking result. It may already exist. Please contact the host before booking again; do not resubmit or refresh to retry.');
        }
    }
    document.body.addEventListener('htmx:beforeRequest', function(event) {
        var detail = event.detail;
        if (isBooking(detail)) {
            if (bookingLocked) { event.preventDefault(); return; }
            bookingLocked = true;
            form.dataset.bookingState = 'pending';
            submit.disabled = true;
            submit.textContent = 'Confirming…';
            notice.hidden = true;
        } else if (isAvailability(detail)) {
            clearSelection();
            slots.textContent = 'Checking availability…';
            if (!bookingLocked) notice.hidden = true;
        }
    });
    document.body.addEventListener('htmx:beforeSwap', function(event) {
        var detail = event.detail;
        if (isBooking(detail)) {
            var state = detail.xhr.getResponseHeader('HX-Booking-State');
            if (detail.xhr.status >= 400 || state === 'unknown' || state === 'not-created' || !detail.xhr.getResponseHeader('HX-Redirect')) {
                detail.shouldSwap = false;
                bookingFailure(detail.xhr);
            }
        } else if (isAvailability(detail) && detail.xhr.status >= 400) {
            detail.shouldSwap = false;
            clearSelection();
            slots.textContent = 'Availability is temporarily unavailable. Please try checking another time or contact the host.';
        }
    });
    ['htmx:sendError', 'htmx:timeout'].forEach(function(name) {
        document.body.addEventListener(name, function(event) {
            if (isBooking(event.detail)) bookingFailure(null);
            else if (isAvailability(event.detail)) {
                clearSelection();
                slots.textContent = 'Availability could not be checked. Please check again later or contact the host.';
            }
        });
    });
    var detected = Intl.DateTimeFormat().resolvedOptions().timeZone;
    var zones = [
        "Europe/London", "Europe/Berlin", "Europe/Paris", "Europe/Madrid",
        "Europe/Rome", "Europe/Belgrade", "Europe/Sofia", "Europe/Moscow", "Europe/Istanbul",
        "America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles",
        "America/Sao_Paulo", "Asia/Dubai", "Asia/Kolkata", "Asia/Singapore", "Asia/Shanghai",
        "Asia/Tokyo", "Asia/Seoul", "Australia/Sydney", "Pacific/Auckland",
        "UTC"
    ];
    if (zones.indexOf(detected) === -1) {
        zones.unshift(detected);
    }
    var sel = document.getElementById('guest-tz');
    zones.forEach(function(tz) {
        var opt = document.createElement('option');
        opt.value = tz;
        opt.textContent = tz.replace(/_/g, ' ');
        if (tz === detected) opt.selected = true;
        sel.appendChild(opt);
    });
    document.addEventListener('DOMContentLoaded', function() {
        htmx.trigger(document.getElementById('date-picker'), 'change');
    });
})();
</script>

{{template "foot" .}}
{{end}}
